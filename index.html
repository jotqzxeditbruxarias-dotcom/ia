<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silva AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <img src="assets/silva-ai.jpg">
      <div>
        <h1>Silva AI</h1>
        <span>Seu assistente de IA</span>
      </div>
    </header>

    <main id="chat">

      <div class="welcome">
        <img src="assets/silva-ai.jpg">
        <h2>Olá! 👽</h2>
        <p>Eu sou o Silva AI. Como posso ajudar?</p>
      </div>

    </main>

    <form id="form">
      <input
        id="message"
        type="text"
        placeholder="Digite uma mensagem..."
        autocomplete="off"
      >

      <button type="submit">➤</button>
    </form>

  </div>

  <script src="script.js"></script>

</body>
</html>
